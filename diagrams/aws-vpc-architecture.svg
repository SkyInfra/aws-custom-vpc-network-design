<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">AWS custom VPC network architecture</title>
<desc id="desc">A custom VPC in us-east-1 with two Availability Zones, two public and two private subnets, an Internet Gateway, separate public and private route tables, and public and private EC2 instances.</desc>
<defs>
<style>
.title{font:700 34px Arial,sans-serif;fill:#10233f}.sub{font:16px Arial,sans-serif;fill:#52647b}.h2{font:700 22px Arial,sans-serif;fill:#17365c}.h3{font:700 17px Arial,sans-serif;fill:#17365c}.body{font:15px Arial,sans-serif;fill:#30445d}.small{font:13px Arial,sans-serif;fill:#53677f}.tiny{font:12px Arial,sans-serif;fill:#53677f}
.vpc{fill:#f7f9fc;stroke:#45617f;stroke-width:3;stroke-dasharray:12 8}.az{fill:#edf3fb;stroke:#9bb0c9;stroke-width:2}.pub{fill:#e5f1ff;stroke:#3982c8;stroke-width:2}.priv{fill:#e7f6ef;stroke:#29966b;stroke-width:2}.card{fill:#fff;stroke:#a9b8c9;stroke-width:1.5}.igw{fill:#fff4d6;stroke:#d99a22;stroke-width:2}.route{fill:#fff;stroke:#6e8299;stroke-width:1.5}.flow{fill:none;stroke:#26966b;stroke-width:3;stroke-dasharray:8 6}
</style>
<marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#d18a16"/></marker>
<marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#26966b"/></marker>
</defs>
<rect width="1600" height="1100" fill="#fff"/>
<text x="800" y="52" text-anchor="middle" class="title">AWS CUSTOM VPC NETWORK DESIGN</text>
<text x="800" y="82" text-anchor="middle" class="sub">US East (N. Virginia) • us-east-1 • VPC CIDR 10.20.0.0/16</text>
<rect x="650" y="110" width="300" height="70" rx="14" class="igw"/>
<text x="800" y="140" text-anchor="middle" class="h3">Internet Gateway</text><text x="800" y="162" text-anchor="middle" class="small">Attached to the VPC</text>
<rect x="55" y="225" width="1490" height="760" rx="22" class="vpc"/>
<text x="88" y="265" class="h2">Custom VPC • 10.20.0.0/16</text>
<rect x="90" y="295" width="690" height="650" rx="18" class="az"/><text x="435" y="333" text-anchor="middle" class="h2">Availability Zone us-east-1a</text>
<rect x="820" y="295" width="690" height="650" rx="18" class="az"/><text x="1165" y="333" text-anchor="middle" class="h2">Availability Zone us-east-1b</text>
<rect x="125" y="360" width="620" height="230" rx="14" class="pub"/>
<text x="150" y="395" class="h3">Public Subnet A • 10.20.1.0/24</text>
<rect x="155" y="420" width="255" height="115" rx="10" class="card"/>
<text x="282" y="450" text-anchor="middle" class="h3">Public EC2</text><text x="282" y="475" text-anchor="middle" class="body">10.20.1.249</text><text x="282" y="500" text-anchor="middle" class="small">Public IPv4 100.31.120.30</text>
<rect x="435" y="420" width="280" height="115" rx="10" class="card"/>
<text x="575" y="450" text-anchor="middle" class="h3">Public Security Group</text><text x="575" y="475" text-anchor="middle" class="small">TCP 80, 443 inbound</text><text x="575" y="500" text-anchor="middle" class="small">SSH 22 from admin /32</text>
<rect x="125" y="620" width="620" height="230" rx="14" class="priv"/>
<text x="150" y="655" class="h3">Private Subnet A • 10.20.2.0/24</text>
<rect x="155" y="680" width="255" height="115" rx="10" class="card"/>
<text x="282" y="710" text-anchor="middle" class="h3">Private EC2</text><text x="282" y="735" text-anchor="middle" class="body">10.20.2.209</text><text x="282" y="760" text-anchor="middle" class="small">No public IPv4 address</text>
<rect x="435" y="680" width="280" height="115" rx="10" class="card"/>
<text x="575" y="710" text-anchor="middle" class="h3">Private Security Group</text><text x="575" y="735" text-anchor="middle" class="small">TCP 8080 + ICMP inbound</text><text x="575" y="760" text-anchor="middle" class="small">Source: Public Security Group</text>
<rect x="855" y="360" width="620" height="230" rx="14" class="pub"/>
<text x="880" y="395" class="h3">Public Subnet B • 10.20.3.0/24</text>
<rect x="905" y="435" width="520" height="100" rx="10" class="card"/><text x="1165" y="475" text-anchor="middle" class="h3">Public subnet</text><text x="1165" y="502" text-anchor="middle" class="small">Shared public route-table association</text>
<rect x="855" y="620" width="620" height="230" rx="14" class="priv"/>
<text x="880" y="655" class="h3">Private Subnet B • 10.20.4.0/24</text>
<rect x="905" y="695" width="520" height="100" rx="10" class="card"/><text x="1165" y="735" text-anchor="middle" class="h3">Private subnet</text><text x="1165" y="762" text-anchor="middle" class="small">Shared private route-table association</text>
<rect x="105" y="865" width="650" height="85" rx="10" class="route"/><text x="130" y="895" class="h3">Public route table</text><text x="130" y="922" class="small">Local route • 0.0.0.0/0 → IGW • both public subnets</text>
<rect x="845" y="865" width="650" height="85" rx="10" class="route"/><text x="870" y="895" class="h3">Private route table</text><text x="870" y="922" class="small">Local route only • no IGW/NAT default route • both private subnets</text>
<path d="M800 180V210H435V355" fill="none" stroke="#d18a16" stroke-width="3" marker-end="url(#amber)"/><path d="M800 210H1165V355" fill="none" stroke="#d18a16" stroke-width="3" marker-end="url(#amber)"/>
<path d="M282 535V675" class="flow" marker-end="url(#green)"/><text x="300" y="610" class="tiny">Allowed ICMP / TCP 8080</text>
<rect x="90" y="1005" width="1420" height="75" rx="12" fill="#f5f8fc" stroke="#d5dfeb"/>
<text x="120" y="1035" class="h3">Validation: public EC2 → private EC2</text><text x="120" y="1060" class="small">Ping: 4/4 received • TCP 8080: connection refused (no listener) • TCP 80: timed out (no matching private SG ingress rule)</text>
</svg>